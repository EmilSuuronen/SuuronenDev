<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="AR lenses, filters and games by Emil Suuronen." />
<title>AR Lenses · Emil Suuronen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root { --snap: #fffc00; --fg: #f4f4f5; --dim: #71717a; }
  * { box-sizing: border-box; margin: 0; }
  html { background: #000; color: var(--fg); }
  body { font-family: "IBM Plex Mono", monospace; min-height: 100vh; overflow-x: hidden; }
  #particles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  header, main, footer { position: relative; }
  header { padding: 18vh 6vw 10vh; }
  h1 { font: 700 clamp(2.6rem, 9vw, 7.5rem)/0.9 "Space Grotesk", sans-serif; letter-spacing: -0.04em; }
  h1 span { display: block; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.55); }
  .sub { margin-top: 1.6rem; color: var(--dim); font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; }

  .snap {
    display: inline-flex; align-items: center; gap: .6rem; margin-top: 2.4rem;
    padding: .7rem 1.2rem; border-radius: 999px; background: var(--snap); color: #000;
    font: 500 .9rem "IBM Plex Mono", monospace; text-decoration: none;
    box-shadow: 0 0 0 rgba(255,252,0,0); transition: box-shadow .3s, transform .3s;
  }
  .snap:hover, .snap:focus-visible { box-shadow: 0 0 40px rgba(255,252,0,.45); transform: translateY(-2px); }
  .snap svg { width: 1.1rem; height: 1.1rem; }

  main {
    display: grid; gap: clamp(10px, 1.6vw, 22px); padding: 0 6vw;
    grid-template-columns: repeat(auto-fill, minmax(min(42vw, 190px), 1fr));
    grid-auto-flow: dense;
  }
  .tile {
    position: relative; aspect-ratio: 9 / 16; padding: 0; border: 0; cursor: pointer;
    border-radius: 18px; overflow: hidden; background: #0b0b0d;
    opacity: 0; transform: translateY(40px) scale(.97);
    transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1), box-shadow .4s;
  }
  .tile.in { opacity: 1; transform: none; }
  .tile.big { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; }
  .tile:hover, .tile:focus-visible { box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 20px 60px -10px rgba(140,160,255,.35); outline: none; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s; }
  .tile:hover video { transform: scale(1.04); }
  .tile span {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 2.5rem .9rem .8rem; text-align: left;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff;
    font: 500 .72rem "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase;
    opacity: 0; transition: opacity .3s;
  }
  .tile:hover span, .tile:focus-visible span { opacity: 1; }
  @media (hover: none) { .tile span { opacity: 1; } }

  footer { padding: 14vh 6vw 10vh; text-align: center; color: var(--dim); font-size: .75rem; letter-spacing: .2em; }
  footer .snap { margin: 0 0 2rem; }

  dialog { border: 0; padding: 0; background: transparent; max-width: none; max-height: none; overflow: visible; margin: auto; }
  dialog::backdrop { background: rgba(0,0,0,.88); backdrop-filter: blur(8px); }
  dialog video { display: block; height: min(88vh, 160vw); aspect-ratio: 9 / 16; border-radius: 22px; background: #000; }
  dialog p { margin-top: .9rem; text-align: center; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: #d4d4d8; }

  @media (prefers-reduced-motion: reduce) { .tile { transition: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas>

<header>
  <h1>Emil<span>Suuronen</span></h1>
  <p class="sub">Lenses · Filters · AR games</p>
  <a class="snap" href="https://www.snapchat.com/@empuhtin" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c3 0 5.4 2.3 5.4 5.6l-.1 2.6c.4.2 1 .1 1.5-.1.6-.2 1.2.4.7 1-.4.4-1.6.7-2 1 .3 1.6 2 3.9 4.2 4.3.4.1.4.6 0 .8-.6.3-1.6.5-2.2.6-.2.3-.1 1-.5 1.1-.7.2-1.6-.2-2.6.1-1 .3-2 1.9-4.4 1.9s-3.4-1.6-4.4-1.9c-1-.3-1.9.1-2.6-.1-.4-.1-.3-.8-.5-1.1-.6-.1-1.6-.3-2.2-.6-.4-.2-.4-.7 0-.8 2.2-.4 3.9-2.7 4.2-4.3-.4-.3-1.6-.6-2-1-.5-.6.1-1.2.7-1 .5.2 1.1.3 1.5.1l-.1-2.6C6.6 4.3 9 2 12 2z"/></svg>
    @empuhtin
  </a>
</header>

<main id="grid"></main>

<footer>
  <a class="snap" href="https://www.snapchat.com/@empuhtin" target="_blank" rel="noopener">More on Snapchat ↗</a>
  <p>Made in Lens Studio</p>
</footer>

<dialog id="viewer"><video muted loop playsinline></video><p></p></dialog>

<script>
  // [file slug, title, big tile?] — featured first, order is the visual layout
  const LENSES = [
    ["holo-sticker", "Holo Sticker", 1],
    ["pocket-pixel", "Pocket Pixel", 0],
    ["ascii-world", "ASCII World", 0],
    ["thermal-vision", "Thermal Vision", 0],
    ["disc-golf-tour", "Disc Golf Tour", 1],
    ["block-pop", "Block Pop", 0],
    ["crystal-prism", "Crystal Prism", 0],
    ["datamosh", "Datamosh", 0],
    ["ghost-photographer", "Ghost Photographer", 0],
    ["pixel-world", "Pixel World", 1],
    ["crt-tv", "CRT TV", 0],
    ["beat-the-bot", "Beat the Bot", 0],
    ["slit-scan-time-warp", "Slit-Scan Time Warp", 0],
    ["dreamy-film", "Dreamy Film", 0],
    ["here-lies-you", "Here Lies You", 0],
    ["glitter-gloss", "Glitter Gloss", 0],
    ["body-echo", "Body Echo", 0],
    ["poetcore", "Poetcore", 0],
    ["ghostface", "Ghostface", 0],
    ["jelly-face", "Jelly Face", 0],
    ["are-you-the-problem", "Are You the Problem", 0],
    ["backrooms", "Backrooms", 0],
  ];

  const grid = document.getElementById("grid");
  const viewer = document.getElementById("viewer");
  const big = viewer.querySelector("video");

  for (const [slug, title, isBig] of LENSES) {
    const b = document.createElement("button");
    b.className = "tile" + (isBig ? " big" : "");
    b.setAttribute("aria-label", title);
    b.innerHTML = `<video muted loop playsinline preload="none" poster="v/${slug}.jpg" src="v/${slug}.mp4"></video><span>${title}</span>`;
    b.onclick = () => {
      big.src = `v/${slug}.mp4`;
      viewer.querySelector("p").textContent = title;
      viewer.showModal();
      big.play().catch(() => {});
    };
    grid.append(b);
  }

  viewer.onclick = () => viewer.close();
  viewer.onclose = () => big.pause();

  // Only play tiles on screen, so 22 videos never decode at once.
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      const v = e.target.querySelector("video");
      if (e.isIntersecting) { e.target.classList.add("in"); v.play().catch(() => {}); }
      else v.pause();
    }
  }, { threshold: 0.15 });
  grid.querySelectorAll(".tile").forEach((t) => io.observe(t));

  // Particle field: drifting motes that shy away from the cursor.
  const c = document.getElementById("particles");
  const ctx = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mouse = { x: -1e4, y: -1e4 };
  const COLORS = ["255,255,255", "255,252,0", "150,170,255", "255,140,220"];
  let W, H, parts = [];

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parts = Array.from({ length: Math.round(Math.min(160, W * H / 9000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .15, vy: -Math.random() * .35 - .05,
      r: Math.random() * 1.6 + .3, a: Math.random() * .6 + .15,
      c: COLORS[Math.random() < .8 ? 0 : 1 + (Math.random() * 3 | 0)],
      t: Math.random() * 6.28,
    }));
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 14400) { const f = (1 - d2 / 14400) * .6; p.x += dx / Math.sqrt(d2 + 1) * f * 4; p.y += dy / Math.sqrt(d2 + 1) * f * 4; }
      p.t += .02; p.x += p.vx + Math.sin(p.t) * .12; p.y += p.vy;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      if (p.x < -5) p.x = W + 5; else if (p.x > W + 5) p.x = -5;
      const tw = p.a * (.6 + .4 * Math.sin(p.t * 1.7));
      ctx.fillStyle = `rgba(${p.c},${tw})`;
      ctx.shadowColor = `rgba(${p.c},${tw})`;
      ctx.shadowBlur = p.r * 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    if (!still) requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  resize(); frame();
</script>
</body>
</html>
